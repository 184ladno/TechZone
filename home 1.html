<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin:0px;
        padding:0px;
        background:linear-gradient(rgba(238, 243, 238, 0.993),rgba(167, 177, 157, 0.747));
    }
    .header{
        padding-top: 1%;
        width:100%;
        height:8vh;
        background-color:rgb(198, 223, 198);
        display:flex;
        border:1px solid rgb(161, 197, 161);
        box-shadow: 10px 10px 8px rgb(123, 160, 123);
        isolation:isolate;
        position: relative;
    }
    .header::before{
        content:"";
        position: absolute;
        inset:0;
        background-image: url(images/halloween-concept-dark-old-wall-with-cobwebs_78677-4456.avif);
        opacity:0.2;
    }
    .header img{
        width:6%;
        height:8vh;
        display: flex;
        padding-bottom: 1vh;
        padding-top: none;
        float: left;
    }
    .header h1{
        display:flex;
        color:darkslategray;
        font-family: Georgia, 'Times New Roman', Times, serif;
        margin: 0 auto;
    }

    .menu{
        display: none;/* hidden until the button is clicked */
        background-color: rgba(198, 223, 198, 0.562);
        border:1px solid rgb(161, 197, 161);
        box-shadow: 10px 10px 8px rgb(123, 160, 123);
        position: absolute;
        right:0;
        border-radius: 4vh;
    }
    .menubar{
        display: block;
        width: 6vh;
        height: 6vh;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(255,255,255,0.45);
        cursor: pointer;
        overflow: hidden;
    }
    .menubar img{
        width: 100%;
        height: 100%;
        object-fit: contain;
        background:none;
        border:none;
    }
    
    .bar{
        z-index: 2;
        margin: 0 10vh 0 0;
        position: static;
        align-self: center;
        display: flex;
    }
        
    span{
        margin:0 auto;
    }
    .menu ul{
        padding:0px;
        list-style: none;
    }
    .menu.open{
        display:block;
    }
    .menu ul li{
        width: 50%;
        margin:2vh;
        margin-left:5vh;
        height: auto;
        text-align: center;
        line-height: 5vh;
        padding-right:50px;
    }
    .menu ul li a{
        text-decoration: none;
        border: 2px solid rgb(198, 223, 198);
        border-radius: 25px;
        padding:1vh;
        font-size: medium;
        background-color:rgba(198, 223, 198, 0.993);
        box-shadow: 1px 2px 8px rgba(145, 151, 139, 0.747);
        color:darkslategray;
        display: inline-block;
        transition: transform 0.2s ease, 0.2s ease;
    }
    .menu ul li a:hover{
        background-color: rgb(166, 204, 166);
        transform: scale(1.2);
    }
    .content{
        height:auto;
    }
    .content h1{
        text-align: center;
        font-size: 6vh;
        background:linear-gradient(to right,darkslategray, rgba(103, 141, 65, 0.747));
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }
    .content img{
        padding-top: 3%;
        width: 100%;
        z-index:-1;
    }
    .footer{
        background-color: cornflowerblue;
        text-align: center;
        width: auto;
        height: auto;
    }
    .carousel{
        position:relative;
        margin:2em auto;
        text-align: center;
    }
 
    .slide.active{
        display: block;
    }
    .img img:hover{
        background-color: rgba(206, 212, 206, 0.699);
        transform: scale(1.2);
    }

    .img img{
        width: 50%;
        height: 20%;
        object-fit: cover;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        transition: transform 0.2s ease, 0.2s ease;
        z-index: -1;
    }

    .slide h2{
        margin:0;
        font-size: 1.4em;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        z-index: 3;
    }
    .arrow {
        position: absolute;
        top: 170px;           
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: #4a5568;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
    }
    .arrow:hover { background: #1a202c; }
    .prev { left: 0; }
    .next { right: 0; }

    .viewport {
        overflow: hidden;
        width: 100%;
    }
    .track {
        display: flex;
        width: 100%;
        transition: transform 0.5s ease;
    }

    .slide {
        flex: 0 0 100%;
        width: 100%;
        display: block;
        text-align: center;
    }
</style>
<body>
    <div class="header">
        <img src="images/TECHZONE.png" alt="logo">
        <h1><span>TechZone Electronics</span></h1>
        <div class="bar">
        <button class="menubar" onclick="GetNav()"><img src="images/1935494a-3ff5-496a-9989-e975504fb746-removebg-preview.png"></button>
        </div>
    </div>
    <div class="content">
        <div class="menu">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="offers.html">Special Offers</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    <img src="images/Tech_and_Gadgets_2.jpg">
    <h1>Smarter Tech. Better Living.</h1>
<section class="carousel">

    <div class="viewport">
        <div class="track">

            <div class="slide">
                <div class="img">
                    <img src="images/Screenshot_2-10-2026_144250_www.lenovo.com-removebg-preview.png" alt="Lenovo">
                    <h2>Lenovo</h2>
                </div>
            </div>

            <div class="slide">
                <div class="img">
                    <img src="images/Screenshot_2-10-2026_144547_www.bing.com.jpeg" alt="Bing">
                    <h2>Bing</h2>
                </div>
            </div>

            <div class="slide">
                <div class="img">
                    <img src="images/Screenshot_2-10-2026_144843_www.next.co.uk.jpeg" alt="Next">
                    <h2>Next</h2>
                </div>
            </div>

        </div>
    </div>

    <button class="arrow prev" aria-label="Previous">&#10094;</button>
    <button class="arrow next" aria-label="Next">&#10095;</button>

</section>
    <div class="footer">
        <p>123 High Street 
            Leicester 
            LE1 1AA 
            
             </p>
             
        <p>Telephone: 0116 123 4567 <br>
            Email: info@techzone.example</p>
    </div>
</body>
<script>
const track = document.querySelector('.track');
const slides = document.querySelectorAll('.slide');

let current = 0;

function goTo(index) {
    if (index < 0) {
        current = slides.length - 1;
    } else if (index >= slides.length) {
        current = 0;
    } else {
        current = index;
    }

    track.style.transform = `translateX(-${current * 100}%)`;
}

document.querySelector('.prev').addEventListener('click', function() {
    goTo(current - 1);
});

document.querySelector('.next').addEventListener('click', function() {
    goTo(current + 1);
});

goTo(0);
</script>
</html>
